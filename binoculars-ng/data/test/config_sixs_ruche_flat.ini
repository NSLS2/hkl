## the DISPATCHER is responsible for job management
[dispatcher]
type = local # run local
#type = singlecore # run local
ncores = 4 # optionally, specify number of cores (autodetect by default)
# specificy destination file using scan numbers
destination = name_{projection}_{first}-{last}_{limits}.hdf5
overwrite = false

### choose an appropriate INPUT class and specify custom options
[input]
#: the list of the available values are:
#type = sixs:flymedh
#type = sixs:flymedhgisaxs
#type = sixs:flymedv
#type = sixs:flymedvgisaxs
type = sixs:flyuhv
#type = sixs:flyuhvgisaxs
#type = sixs:sbsmedh
#type = sixs:sbsmedhgisaxs
#type = sixs:sbsmedv
#type = sixs:sbsmedvgisaxs
#type = sixs:sbsuhv
#type = sixs:sbsuhvgisaxs

nexusdir = /nfs/ruche/sixs-soleil/com-sixs/2026/Run2/Durinck_20251861/  # be careful no more "/ruche-sixs/"
#inputrange = 1087-1121

# the list of known detectors is:
#detector = ImXpadS70
detector = ImXpadS140
#detector = Eiger1M
#detector = Ufxc
#detector = Merlin
#detector = MerlinMedipix3RXQuad
#detector = MerlinMedipix3RXQuad512

centralpixel = 293,88  # x,y
sdd = 1.2373          # sample to detector distance (m)
detrot = 90   #  ImXpadS140 (0° => Horizontal detector ;    90° => Vertical detector)
#                Eiger1M    (0° => Horizontal bar      ;   -90° => Vertical bar)

attenuation_coefficient = 1.8
attenuation_shift = 0
#attenuation_max = 4

#dynamic_mask = 2e9
#image_sum_max = 1000000
#skip_first_points
#skip_last_points

polarization_correction = true

flatmatrix = /nfs/ruche/sixs-soleil/com-sixs/2026/Run2/Durinck_20251861/Au111_2/flat.npy

maskmatrix = /nfs/ruche/sixs-soleil/com-sixs/2026/Run2/Durinck_20251861/Au111_2/mask.npy
#maskmatrix = /nfs/ruche/sixs-soleil/com-sixs/2026/Run2/Durinck_20251861/Au111_1/mask_nxs00347_20260410_15h41.npy
#maskmatrix = /nfs/ruche/sixs-soleil/com-sixs/2026/Run2/Durinck_20251861/align/mask_nxs00010_20260407_16h20.npy
#maskmatrix = /nfs/ruche/sixs-soleil/com-sixs/202?/Run?/number?_name?/???/mask_nxs?????_date_24h00.npy  # ImXpadS140 (be careful no more "/ruche-sixs/" )

#wavelength = 1.54 # (if not in nxsfile !)

#a = 1.54	## Used only for HKL projection
#b = 1.54	## Used only for HKL projection
#c= 1.54	## Used only for HKL projection
#alpha	= 90.0	## Used only for HKL projection
#beta = 90.0	## Used only for HKL projection
#gamma = 90.0	## Used only for HKL projection
#ux = -90.0	## Used only for HKL projection
#uy = 0.0	## Used only for HKL projection
#uz = 0.0	## Used only for HKL projection

surface_orientation = vertical 		## Used only for Q projection (ATTENTION '_')
#surface_orientation = horizontal 	## Used only for Q projection

[projection]

#type = hkl # refers to HklProjection
#type = qindex # refers to q time (a tester!)
#type = realspace
#type = pixels

type = qcustom #
subprojection = qx_qy_qz
#subprojection = qpar_qper
#subprojection = q_qpar_qper
#subprojection = q_tth_timestamp
#subprojection = qpar_qper_sampleaxis
#subprojection = q_sampleaxis_tth
#subprojection = tth_azimuth

#subprojection = qpar_qper_timestamp
