[dispatcher]
ncores = 8
destination = scan_{projection}_{first}-{last}.hdf5
overwrite = false

[input]
type = mars::sbspyfai
nexusdir = /nfs/ruche/mars-soleil/com-mars/2026/2026_Run2/20252223
inputtmpl = scan_%04d
inputrange = 30
detector = PilatusCdTe2M
dynamic_mask = 1e4
maskmatrix = /nfs/ruche/mars-soleil/com-mars/2026/2026_Run2/20252223/published-data/mask_{index0:d}.npy
ponis = /nfs/ruche/mars-soleil/com-mars/2026/2026_Run2/20252223/published-data/scan_0030_0001.nxs_{index0:02d}.poni

[projection]
type = qcustom
subprojection = tth_azimuth
resolution = 0.005, 1, 1
